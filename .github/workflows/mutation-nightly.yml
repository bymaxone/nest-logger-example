name: Mutation Testing (Nightly Full)

# A scheduled run is skipped when `main` has no commit since the last run of
# this workflow that finished with a verdict (success or failure): the score
# depends only on what the repository holds, so the same commit measured again
# gives the same verdict, and a failed week has already been reported. A manual
# run always measures.
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: postgresql://ci_runner@localhost/ci_placeholder

jobs:
  changed:
    name: New commit since the last run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation-nightly.yml \
            --branch "$DEFAULT_BRANCH" --status completed --limit 20 --json headSha,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // empty')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No commit on $DEFAULT_BRANCH since the last run ($last); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  full-api:
    name: Mutation full — apps/api
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @nest-logger-example/api run db:generate
        env:
          # generate never opens a connection — a credential-free placeholder URL
          # only needs to satisfy the schema's env("DATABASE_URL") reference.
          DATABASE_URL: postgresql://localhost:5432/ci_placeholder
      - name: Run full mutation testing (api)
        working-directory: apps/api
        # --force runs all mutants and rebuilds the incremental file, giving a
        # true cold baseline regardless of any cached incremental state.
        run: pnpm exec stryker run --force
      - name: Upload full mutation HTML report (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-api-full
          path: apps/api/reports/mutation/
          retention-days: 90
      - name: Open drift issue on regression (api)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Mutation drift detected (api) — $(date -u +%Y-%m-%d)"
          if gh issue list --label mutation-drift --state open \
               --search "in:title (api)" | grep -q .; then
            echo "Open mutation-drift issue already exists — skipping."
            exit 0
          fi
          gh issue create \
            --title "${TITLE}" \
            --label mutation-drift \
            --body "The weekly full Stryker run on \`apps/api\` regressed below its \`break\` threshold. Run \`pnpm --filter @nest-logger-example/api run mutation:incremental\` locally to investigate. Run: ${RUN_URL}"

  full-web:
    name: Mutation full — apps/web
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run full mutation testing (web)
        working-directory: apps/web
        # --force runs all mutants and rebuilds the incremental file, giving a
        # true cold baseline regardless of any cached incremental state.
        run: pnpm exec stryker run --force
      - name: Upload full mutation HTML report (web)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-web-full
          path: apps/web/reports/mutation/
          retention-days: 90
      - name: Open drift issue on regression (web)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Mutation drift detected (web) — $(date -u +%Y-%m-%d)"
          if gh issue list --label mutation-drift --state open \
               --search "in:title (web)" | grep -q .; then
            echo "Open mutation-drift issue already exists — skipping."
            exit 0
          fi
          gh issue create \
            --title "${TITLE}" \
            --label mutation-drift \
            --body "The weekly full Stryker run on \`apps/web\` regressed below its \`break\` threshold. Run \`pnpm --filter web run mutation:incremental\` locally to investigate. Run: ${RUN_URL}"
